name: Build & Release Windows Desktop Client

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Clean & Install Desktop Dependencies
        working-directory: desktop
        shell: pwsh
        run: |
          if (Test-Path package-lock.json) { Remove-Item -Force package-lock.json }
          npm install --legacy-peer-deps

      - name: Build Vite Assets
        working-directory: desktop
        run: npx vite build

      - name: Package Windows Installer (.exe)
        working-directory: desktop
        run: npx electron-builder --win nsis --x64

      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VisionVault-Setup-Windows
          path: desktop/build_output/VisionVault Setup.exe

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: desktop/build_output/VisionVault Setup.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
