<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 160" fill="none">
  <defs>
    <linearGradient id="vv-text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="vv-mark-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c87e8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
  </defs>

  <!-- Logo Mark -->
  <g transform="translate(15, 10) scale(0.75)">
    <path d="M 100,20 L 165,45 C 165,115 135,160 100,180 C 65,160 35,115 35,45 Z" fill="url(#vv-mark-grad)" />
    <path d="M 100,32 L 152,53 C 152,108 127,147 100,163 C 73,147 48,108 48,53 Z" fill="#0a0f1d" />
    <ellipse cx="100" cy="98" rx="34" ry="22" stroke="url(#vv-text-grad)" stroke-width="6" fill="none" />
    <circle cx="100" cy="98" r="10" fill="url(#vv-mark-grad)" />
    <circle cx="100" cy="98" r="4" fill="#ffffff" />
  </g>

  <!-- Text Wordmark -->
  <text x="170" y="95" font-family="Inter, system-ui, sans-serif" font-weight="800" font-size="52" fill="#ffffff" letter-spacing="-1">
    Vision<tspan fill="url(#vv-text-grad)">Vault</tspan>
  </text>
  
  <text x="172" y="125" font-family="Inter, system-ui, sans-serif" font-weight="500" font-size="16" fill="#94a3b8" letter-spacing="0.5">
    YOUR FILES. ONE VAULT. ANYWHERE.
  </text>
</svg>
