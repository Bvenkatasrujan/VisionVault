<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <linearGradient id="vv-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c87e8" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="vv-grad-2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <filter id="vv-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Vault Shield Body -->
  <path 
    d="M 100,20 L 165,45 C 165,115 135,160 100,180 C 65,160 35,115 35,45 Z" 
    fill="url(#vv-grad-1)" 
    filter="url(#vv-glow)"
    opacity="0.95"
  />

  <!-- Inner Vault Shield Cutout -->
  <path 
    d="M 100,32 L 152,53 C 152,108 127,147 100,163 C 73,147 48,108 48,53 Z" 
    fill="#0a0f1d" 
  />

  <!-- Vision Eye / Core Ring -->
  <ellipse cx="100" cy="98" rx="34" ry="22" stroke="url(#vv-grad-2)" stroke-width="6" fill="none" />
  
  <!-- Vault Iris Pupil -->
  <circle cx="100" cy="98" r="10" fill="url(#vv-grad-1)" />

  <!-- Teleport Energy Ring Nodes -->
  <circle cx="100" cy="98" r="4" fill="#ffffff" />
  <circle cx="100" cy="62" r="3" fill="#38bdf8" />
  <circle cx="100" cy="134" r="3" fill="#6366f1" />
  <circle cx="64" cy="98" r="3" fill="#06b6d4" />
  <circle cx="136" cy="98" r="3" fill="#38bdf8" />
</svg>
